[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# El service worker y el manifest no deben quedarse en caché del navegador,
# para que las actualizaciones lleguen al teléfono.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"
    Cache-Control = "no-cache"

# Archivos con hash: caché larga
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Cabeceras de seguridad para todo el sitio.
# connect-src/img-src permiten el proyecto de Supabase (API, sesión en tiempo real
# y fotos en Storage). img-src incluye data: y blob: para ilustraciones y la vista
# previa de fotos antes de subirlas. El pago con Stripe es una navegación, no una conexión.
[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self'; connect-src 'self' https://hvxvodqnbjwslwizlwob.supabase.co wss://hvxvodqnbjwslwizlwob.supabase.co; img-src 'self' data: blob: https://hvxvodqnbjwslwizlwob.supabase.co; frame-ancestors 'self'; object-src 'none'; base-uri 'self'; form-action 'self'"
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
