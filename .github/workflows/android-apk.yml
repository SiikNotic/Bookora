# Compila el APK de Android en cada push y lo deja para descargar
# (pestaña Actions → la ejecución → Artifacts → bookora-apk).
# Sin secretos de firma genera un APK de prueba (debug); con ellos, uno firmado
# de producción (release). Ver README → "APK de Android".
name: APK Android

on:
  push:
    branches: [main, claude/new-session-hybsg2]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    # Los secretos de firma solo se pasan a los pasos que los usan (nunca a npm ci,
    # cuyos scripts de instalación de dependencias podrían leer el entorno).
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Dependencias
        run: npm ci

      - name: Pruebas
        run: npm test

      - name: Compilar la app web
        run: npm run build

      # Notificaciones: con el google-services.json de Firebase se incluyen; sin él, el APK
      # se compila sin el plugin (la app funciona igual, solo que sin avisos).
      - name: Firebase (si está configurado)
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            printf '%s' "$GOOGLE_SERVICES_JSON" > android/app/google-services.json
          else
            node -e "const f='capacitor.config.json',c=require('./'+f);c.android.includePlugins=[];require('fs').writeFileSync(f,JSON.stringify(c,null,2))"
          fi

      - name: Copiar la app al proyecto Android
        run: npx cap sync android

      - name: Clave de firma (si está configurada)
        id: firma
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/app/release.keystore
            echo "firmado=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Compilar el APK firmado (release)
        if: steps.firma.outputs.firmado == 'true'
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: chmod +x gradlew && ./gradlew assembleRelease

      - name: Compilar el APK de prueba (debug)
        if: steps.firma.outputs.firmado != 'true'
        working-directory: android
        run: chmod +x gradlew && ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: bookora-apk
          path: android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
