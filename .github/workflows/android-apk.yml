# Compila el APK de Android en cada push y lo deja para descargar
# (pestaña Actions → la ejecución → Artifacts → bookora-apk).
# Sin secretos de firma genera un APK de prueba (debug); con ellos, uno firmado
# de producción (release). Ver README → "APK de Android".
name: APK Android

on:
  push:
    branches: [main, claude/new-session-hybsg2]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Dependencias
        run: npm ci

      - name: Pruebas
        run: npm test

      - name: Compilar la app web
        run: npm run build

      - name: Copiar la app al proyecto Android
        run: npx cap sync android

      - name: Clave de firma (si está configurada)
        if: env.ANDROID_KEYSTORE_BASE64 != ''
        run: echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/app/release.keystore

      - name: Compilar el APK
        working-directory: android
        run: |
          chmod +x gradlew
          if [ -n "$ANDROID_KEYSTORE_PASSWORD" ]; then ./gradlew assembleRelease; else ./gradlew assembleDebug; fi

      - uses: actions/upload-artifact@v4
        with:
          name: bookora-apk
          path: android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
